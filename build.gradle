plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = "projecte-fabric-26.3"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom {
    splitEnvironmentSourceSets()

    mods {
        projecte {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "projecte_preservation_tests"
        enableGameTests = true
        eula = true
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Optional release fixtures for machine drop / transmutation integration tests.
if (providers.gradleProperty('testWithAA').isPresent()) {
    repositories { maven { url = 'https://maven.twelveiterations.com/repository/maven-public/' } }
    dependencies {
        gametestImplementation files('libs/actuallyadditions-beta.2.jar', 'libs/automatic-emc-1.0.1.jar', 'libs/exnihiloomnia-alpha.4.jar')
        gametestImplementation 'net.blay09.mods:balm-fabric:26.3.0.1'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.configuration-cache=true

projecte_version=1.3.0
minecraft_version=1.21.1
minecraft_version_range=1.21.1

# Fabric toolchain (https://fabricmc.net/develop/)
loom_version=1.10.5
loader_version=0.16.14
loader_version_range=>=0.16.9
fabric_version=0.116.14+1.21.1

#Parchment settings (layered on top of Mojang official mappings)
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

junit_version=5.11.4

#misc settings
# recipe viewer used at dev runtime, currently accepts: jei, emi, rei, hybrid, none
recipe_viewer=jei

# Required library versions
# Forge Config API Port (keeps NeoForge ModConfigSpec API on Fabric), jar-in-jar'd
fcap_version=21.1.6
fcap_version_range=>=21.1.0
# fabric-permissions-api (me.lucko), jar-in-jar'd
# 0.3.1 is the compatible release for Minecraft 1.21-1.21.1; 0.3.3 targets 1.21.2+.
permissions_api_version=0.3.1
# PinIn (Chinese pinyin matching, MIT, from JitPack), jar-in-jar'd
# 1.6.0 is the latest release and the same artifact Just Enough Characters nests.
pinin_version=1.6.0

# Mod dependency versions (integrations, all optional at runtime)
emi_version=1.1.24
jade_version=15.10.5+fabric
jei_version=19.39.0.368
rei_version=16.0.799
trinkets_version=3.10.0
cca_version=6.1.2
wthit_version=12.10.2
